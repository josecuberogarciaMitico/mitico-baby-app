name: V2 dependency closure

on:
  push:
    branches:
      - v2
    paths:
      - '.github/workflows/v2-final-dependency-closure.yml'

permissions:
  contents: write

jobs:
  close-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Upgrade patched dependency floor
        run: |
          npm install --save-dev --save-exact vite@6.4.3
          npm pkg set overrides.nanoid=3.3.18
          npm install --package-lock-only

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npx tsc -p tsconfig.app.json

      - name: Core tests
        run: npm run test:core

      - name: Production build
        run: npm run build

      - name: Audit production tree
        run: |
          npm audit --json > audit.json || true
          cat audit.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const v = data.metadata?.vulnerabilities || {};
          const total = Object.values(v).reduce((a,b) => a + Number(b || 0), 0);
          console.log('AUDIT_TOTAL=' + total, v);
          if (total !== 0) process.exit(1);
          NODE

      - name: Commit verified lockfile
        run: |
          rm -f audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Cerrar vulnerabilidades dependencias V2"
            git push origin HEAD:v2
          fi
